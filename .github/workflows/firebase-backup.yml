name: Automatic Firebase Firestore Backup

on:
  schedule:
    # Test schedule: 06:40 UTC = 12:40 PM Bangladesh Standard Time (BST, UTC+6)
    - cron: '40 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firebase-backup:
    name: Run & Commit Firebase Backup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Diagnose Firebase Secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_STATUS=MISSING"
            exit 1
          else
            echo "FIREBASE_SERVICE_ACCOUNT_STATUS=PRESENT"
            echo "FIREBASE_SERVICE_ACCOUNT_LENGTH=${#FIREBASE_SERVICE_ACCOUNT}"
          fi

      - name: Execute Firebase Backup & Verification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/backup.js

      - name: Commit & Push Backup to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git status --porcelain | grep -q 'backups/'; then
            git commit -m "backup: Firebase Firestore Automatic"
            git push
          else
            echo "No backup changes to commit."
          fi

